name: Apache Final Release Upload

on:
  push:
    branches: [main]
    paths:
      - '.github/apache-final-release.trigger'

permissions:
  contents: write

jobs:
  upload:
    if: github.event.head_commit.message == 'ci: publish Apache final release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: apache-final-chatgpt-20260907
      ASSET: Apache_Final_Delivery.zip
      EXPECTED_SIZE: '108143608'
      EXPECTED_SHA256: '1119e498efa9c1c8ac6e77de80346dfe284adc1546c7b50b3ba14515201e969d'
    steps:
      - name: Download staged parts
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 \
            'https://drive.usercontent.google.com/download?id=1sGYWq8Ef5q8eC_6sC_PPmUe-oiI1tcJg&export=download&confirm=t' \
            -o part01
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 \
            'https://drive.usercontent.google.com/download?id=1QYlAObvCTtq8fpCyfBKzZIoAd3fvIMjS&export=download&confirm=t' \
            -o part02
          test "$(stat -c%s part01)" = '62914560'
          test "$(stat -c%s part02)" = '45229048'
          echo '7252c8666857b709472fcd3a37c70746e5294b583d8597ba3f85c29ecf7541d0  part01' | sha256sum -c -
          echo '62e2d05f3e518e845211b8c0a0df0f3983f3f466b9a95bd6e7ebafdd2ff61ea7  part02' | sha256sum -c -

      - name: Reassemble and verify exact package
        shell: bash
        run: |
          set -euo pipefail
          cat part01 part02 > "$ASSET"
          test "$(stat -c%s "$ASSET")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $ASSET" | sha256sum -c -
          unzip -t "$ASSET" >/dev/null

      - name: Create independent release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title 'Apache Final Delivery — ChatGPT session archive' \
            --notes $'Archive of the already-completed Apache final delivery from the ChatGPT session for local Codex comparison against AI-Build-3D R15.\n\nAsset: Apache_Final_Delivery.zip\nBytes: 108143608\nSHA-256: 1119e498efa9c1c8ac6e77de80346dfe284adc1546c7b50b3ba14515201e969d\n\nContains the final GLB, editable Blender source, actual inspection renders, and existing acceptance record. No remodeling was performed by this workflow.'

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
