name: Repackage Blender Artifact

on:
  push:
    paths:
      - .github/workflows/repackage-blender-artifact.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download existing verified release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download blender-5.2.1-linux-x64 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'blender-5.2.1-linux-x64.tar.xz'
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  blender-5.2.1-linux-x64.tar.xz' | sha256sum --check -
      - name: Upload transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-5.2.1-linux-x64
          path: blender-5.2.1-linux-x64.tar.xz
          compression-level: 0
          retention-days: 1
