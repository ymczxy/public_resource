name: Apache photo reference transfer
on:
  push:
    paths: ['.github/workflows/ah64-photo-reference-20260907.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download additional original photographs without manipulation
        shell: bash
        run: |
          mkdir -p refs
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.request import Request, urlopen
          import json, hashlib
          refs = [
            ('side_hockley','https://d1ldvf68ux039x.cloudfront.net/thumbs/photos/2602/9504635/1000w_q95.jpg'),
            ('side_mcneil1','https://d1ldvf68ux039x.cloudfront.net/thumbs/photos/2111/6929108/1000w_q95.jpg'),
            ('side_mcneil2','https://d1ldvf68ux039x.cloudfront.net/thumbs/photos/2111/6929106/1000w_q95.jpg'),
            ('bottom_robinson_full','https://d1ldvf68ux039x.cloudfront.net/photos/2603/9573538.jpg'),
            ('bottom_robinson_2000','https://d1ldvf68ux039x.cloudfront.net/thumbs/photos/2603/9573538/2000w_q95.jpg'),
            ('rear_james_full','https://d1ldvf68ux039x.cloudfront.net/photos/1707/3601287.jpg')]
          def get(item):
            name,url=item
            row={'name':name,'url':url}
            try:
              req=Request(url,headers={'User-Agent':'GA3D-reference-comparison/1.0'})
              with urlopen(req,timeout=35) as response: raw=response.read()
              if not raw.startswith(b'\xff\xd8'): raise ValueError('Not a JPEG')
              Path('refs',name+'.jpg').write_bytes(raw)
              row.update(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),ok=True)
            except Exception as e: row.update(ok=False,error=str(e))
            print(json.dumps(row),flush=True)
            return row
          with ThreadPoolExecutor(max_workers=3) as pool: rows=list(pool.map(get,refs))
          Path('refs/downloads_extra.json').write_text(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ah64-photo-refs-extra-20260907
          path: refs/
          retention-days: 1
          compression-level: 0
