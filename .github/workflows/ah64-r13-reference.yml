name: AH64 R13 reference transport
on:
  push:
    paths: ['.github/workflows/ah64-r13-reference.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch unmodified CC BY-SA 3.0 photograph
        run: |
          set -euo pipefail
          mkdir reference
          curl --fail --location --retry 2 -A 'GA3D-reference-review/1.0' -o reference/arrowhead_ila2022.jpg 'https://upload.wikimedia.org/wikipedia/commons/9/96/Lockheed_Martin_Arrowhead_Apache_ILA-2022.jpg'
          echo 'aceceeaeae421fdf7f357ed5ff35915771ce8752  reference/arrowhead_ila2022.jpg' | sha1sum --check
          sha256sum reference/arrowhead_ila2022.jpg > reference/SHA256SUMS
          printf '%s\n' 'Photo: Lockheed Martin Arrowhead Apache ILA-2022.jpg' 'Author: Boevaya mashina, 22 June 2022' 'License: CC BY-SA 3.0, https://creativecommons.org/licenses/by-sa/3.0/' 'Source: https://commons.wikimedia.org/wiki/File:Lockheed_Martin_Arrowhead_Apache_ILA-2022.jpg' 'Unmodified photograph; reference only, not a texture or a generated six-view.' > reference/ATTRIBUTION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ah64-r13-reference
          path: reference/
          retention-days: 1
          compression-level: 0
